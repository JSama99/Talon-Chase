name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chase
          POSTGRES_PASSWORD: chase
          POSTGRES_DB: chase_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chase" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      CHASE_TEST_POSTGRES_URL: postgresql+psycopg://chase:chase@localhost:5432/chase_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,postgres]"
      - run: ruff check . && ruff format --check .
      - run: pytest
      - run: python -m synthetic.evaluate
