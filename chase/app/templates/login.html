{% extends "signin_base.html" %}
{% block card %}
<h1>Sign in</h1>
<p class="muted">We email you a link. It works once, for 15 minutes. No password.</p>
<form method="post" action="/app/login">
  <input type="hidden" name="next" value="{{ next }}">
  <label for="email">Work email</label>
  <input id="email" type="email" name="email" autocomplete="email" required autofocus>
  <button class="button wide" type="submit">Email me a link</button>
</form>
{% endblock %}
