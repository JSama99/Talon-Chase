# Local run: app + Postgres. Copy .env.example to .env and set the two secrets first.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: chase
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: chase
    volumes:
      - chase-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chase -d chase"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://chase:${POSTGRES_PASSWORD}@db:5432/chase
      CHASE_API_KEY: ${CHASE_API_KEY:?set CHASE_API_KEY in .env}
      CHASE_SECRET: ${CHASE_SECRET:?set CHASE_SECRET in .env}
      CHASE_BASE_URL: ${CHASE_BASE_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:8000:8000"
volumes:
  chase-db:
