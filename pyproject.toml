[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "talon-chase"
version = "0.1.0"
description = "Back-office agent that chases proof of delivery for small freight brokerages"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "sqlalchemy>=2.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "alembic>=1.13",
  "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]
postgres = ["psycopg[binary]>=3.1"]

[tool.setuptools.packages.find]
include = ["chase*", "synthetic*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
