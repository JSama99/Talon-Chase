# Render Blueprint: the Talon Chase service. The database is Supabase Postgres.
# Steps, costs and the Resend webhook: docs/DEPLOY.md
services:
  - type: web
    name: talon-chase
    runtime: docker # the repo's Dockerfile: migrates, then serves on $PORT
    plan: starter # always on; a free instance sleeps, which would stop the tick
    region: virginia # near Supabase's us-east-1; pick the same area for both
    healthCheckPath: /healthz
    envVars:
      # Supabase's Session pooler address (port 5432), asked for on apply.
      - key: DATABASE_URL
        sync: false
      # Made by Render on the first deploy; read them in the dashboard.
      - key: CHASE_SECRET
        generateValue: true
      - key: CHASE_API_KEY
        generateValue: true
      # The service runs its own tick every minute; no separate scheduler.
      - key: CHASE_TICK_SECONDS
        value: "60"
      # CHASE_BASE_URL is not set: the service uses the address Render gives it
      # (RENDER_EXTERNAL_URL). Set it once a custom domain points here.
      # Asked for when the Blueprint is applied:
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      - key: RESEND_VERIFIED_DOMAINS
        sync: false
      - key: RESEND_SHARED_FROM
        sync: false
      - key: RESEND_INBOUND_DOMAIN
        sync: false
      - key: CHASE_LOGIN_FROM
        sync: false
      # Reading documents with Claude (docs/READER.md). Leave both empty to keep the
      # stand-in, which hands every real file to a person.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CHASE_READER_MODEL
        sync: false
