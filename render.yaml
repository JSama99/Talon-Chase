# Render Blueprint: the Talon Chase service and its Postgres database.
# Steps, costs and the Resend webhook: docs/DEPLOY.md
databases:
  - name: talon-chase-db
    plan: basic-256mb
    region: virginia
    postgresMajorVersion: "16" # the version the migration is tested against
    databaseName: chase
    user: chase
    ipAllowList: [] # no outside connections; only Render services can reach it

services:
  - type: web
    name: talon-chase
    runtime: docker # the repo's Dockerfile: migrates, then serves on $PORT
    plan: starter # always on; a free instance sleeps, which would stop the tick
    region: virginia # same region as the database
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: talon-chase-db
          property: connectionString
      # Made by Render on the first deploy; read them in the dashboard.
      - key: CHASE_SECRET
        generateValue: true
      - key: CHASE_API_KEY
        generateValue: true
      # The service runs its own tick every minute; no separate scheduler.
      - key: CHASE_TICK_SECONDS
        value: "60"
      # CHASE_BASE_URL is not set: the service uses the address Render gives it
      # (RENDER_EXTERNAL_URL). Set it once a custom domain points here.
      # Asked for when the Blueprint is applied:
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      - key: RESEND_VERIFIED_DOMAINS
        sync: false
      - key: RESEND_SHARED_FROM
        sync: false
      - key: RESEND_INBOUND_DOMAIN
        sync: false
      - key: CHASE_LOGIN_FROM
        sync: false
